<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NVK Agent — Sovereign Intelligence</title>
    <meta
      name="description"
      content="NVK's sovereign AI agent. Local-first inference, NVK as its face, honest capability status."
    />
    <meta name="theme-color" content="#050608" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <style>
      /* System font stack on purpose: no Google Fonts, no runtime CDN fonts.
         Self-hosting fonts is part of earning the no-external-requests claim. */
      html,
      body {
        margin: 0;
        background: #050608;
        color: #e8eef4;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register the service worker for installable PWA support.
      // Guarded: a registration failure must never break the app load.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
